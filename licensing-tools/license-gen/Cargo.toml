[package]
name = "license-gen"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Offline RSA-4096 license generator for the Business POS System. Windows-only utility."

[dependencies]
licensing-core = { path = "../../licensing-core" }
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde_json = "1.0"
