<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business POS System - Activation</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
                   Ubuntu, Cantarell, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    .card {
      width: 100%; max-width: 480px; margin: 24px;
      padding: 32px; border-radius: 16px;
      background: #1e293b; border: 1px solid #334155;
      box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 22px; color: #fff;
    }
    h1 { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 24px; }
    .banner {
      display: none; padding: 12px 14px; border-radius: 10px;
      font-size: 13px; line-height: 1.5; margin-bottom: 18px;
      border: 1px solid;
    }
    .banner.error { display: block; background: #3f1d1d; border-color: #7f1d1d; color: #fca5a5; }
    .banner.success { display: block; background: #14532d; border-color: #166534; color: #86efac; }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; color: #94a3b8;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px;
    }
    .field .value {
      font-size: 14px; padding: 12px 14px; border-radius: 10px;
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
      word-break: break-all; line-height: 1.4;
    }
    .copy-row { display: flex; gap: 8px; margin-top: 8px; }
    .copy-row .value { flex: 1; }
    .btn {
      flex: none; padding: 10px 14px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: filter .15s;
    }
    .btn:hover { filter: brightness(1.12); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.secondary { background: #334155; color: #e2e8f0; }
    .btn.primary {
      width: 100%; padding: 13px; margin-top: 6px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff;
    }
    .btn.danger { background: #7f1d1d; color: #fca5a5; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .hint { font-size: 12px; color: #64748b; text-align: center; margin-top: 18px; line-height: 1.6; }
    .status-line { font-size: 13px; color: #94a3b8; text-align: center; margin-top: 14px; }
    .spinner {
      display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .copied { font-size: 12px; color: #4ade80; margin-top: 6px; min-height: 16px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">POS</div>
    <h1>Business POS System</h1>
    <p class="subtitle">Activate your license to continue</p>

    <div id="banner" class="banner"></div>

    <div class="field">
      <label>Hardware ID</label>
      <div class="copy-row">
        <div class="value" id="hwid">Loading...</div>
        <button class="btn secondary" id="copyBtn">Copy</button>
      </div>
      <div class="copied" id="copied"></div>
    </div>

    <div class="field">
      <label>License</label>
      <div class="value" id="licenseInfo" style="color:#94a3b8">No file selected</div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="browseBtn">Browse License...</button>
      <button class="btn danger" id="cancelBtn">Exit</button>
    </div>

    <button class="btn primary" id="activateBtn" disabled>Activate</button>
    <div class="status-line" id="status"></div>
    <div class="spinner" id="spinner"></div>
    <p class="hint">One license is valid for one computer only.<br/>You can reach your provider at any time for assistance.</p>
  </div>

  <script>
    (function () {
      "use strict";

      const invoke = window.__TAURI__.core.invoke;

      const banner = document.getElementById("banner");
      const hwidEl = document.getElementById("hwid");
      const copiedEl = document.getElementById("copied");
      const licenseInfo = document.getElementById("licenseInfo");
      const browseBtn = document.getElementById("browseBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const activateBtn = document.getElementById("activateBtn");
      const statusEl = document.getElementById("status");
      const spinner = document.getElementById("spinner");

      let hardwareId = "";
      let selectedPath = "";

      function setBusy(busy) {
        spinner.style.display = busy ? "block" : "none";
        browseBtn.disabled = busy;
        cancelBtn.disabled = busy;
        activateBtn.disabled = busy || !selectedPath;
      }

      function showError(msg) {
        banner.className = "banner error";
        banner.textContent = msg;
      }

      function showSuccess(msg) {
        banner.className = "banner success";
        banner.textContent = msg;
      }

      async function copyHwid() {
        if (!hardwareId) return;
        try {
          await navigator.clipboard.writeText(hardwareId);
        } catch (_) {
          const ta = document.createElement("textarea");
          ta.value = hardwareId;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        copiedEl.textContent = "Hardware ID copied";
        setTimeout(function () { copiedEl.textContent = ""; }, 2000);
      }

      async function loadStatus() {
        try {
          const status = await invoke("get_activation_status");
          hardwareId = status.hardware_id;
          hwidEl.textContent = hardwareId;
          if (status.status === "wrong_hardware") {
            showError(status.message);
          } else if (status.status === "invalid") {
            showError(status.message);
          } else if (status.customer) {
            licenseInfo.textContent = "Customer: " + status.customer;
          }
        } catch (err) {
          showError("Could not read activation status: " + String(err));
        }
      }

      async function browseLicense() {
        statusEl.textContent = "";
        try {
          const path = await invoke("pick_license_file");
          if (!path) return;
          selectedPath = path;
          const file = path.split(/[\\/]/).pop();
          licenseInfo.textContent = "Selected: " + file;
          activateBtn.disabled = false;
        } catch (err) {
          showError("Could not open file dialog: " + String(err));
        }
      }

      async function activate() {
        if (!selectedPath) return;
        setBusy(true);
        statusEl.textContent = "Verifying license...";
        try {
          await invoke("activate_license", { path: selectedPath });
          showSuccess("License activated. Restarting the application...");
          statusEl.textContent = "Restarting...";
        } catch (err) {
          setBusy(false);
          showError("Activation failed: " + String(err));
          statusEl.textContent = "";
        }
      }

      async function cancel() {
        try { await invoke("cancel_activation"); } catch (_) { /* ignore */ }
      }

      document.getElementById("copyBtn").addEventListener("click", copyHwid);
      browseBtn.addEventListener("click", browseLicense);
      activateBtn.addEventListener("click", activate);
      cancelBtn.addEventListener("click", cancel);

      loadStatus();
    })();
  </script>
</body>
</html>
